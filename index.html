
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6739d1">

  <title>Sconnect | Protótipo interativo</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">S</span>
        <span>Sconnect</span>
      </div>

      <button
        id="logout"
        class="top-action"
        type="button"
        hidden>
        Sair
      </button>
    </header>

    <main
      id="app"
      class="content"
      aria-live="polite">
    </main>

    <nav
      id="bottom-nav"
      class="bottom-nav"
      aria-label="Navegação principal"
      hidden>
    </nav>

  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
  </div>
</body>
</html>
